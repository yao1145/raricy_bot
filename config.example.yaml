site:  # 站点连接；账号与密码从 RARICY_USERNAME、RARICY_PASSWORD 环境变量读取
  base_url: "https://raricy.com"  # 机器人访问网站地址
  request_timeout_seconds: 20  # 普通 HTTP 请求超时秒数；SSE 长连接单独设置读超时

model:  # 模型服务配置；API Key 从 LLM_API_KEY 环境变量读取
  base_url: "https://example.com/v1"  # 兼容 OpenAI API 的模型服务地址
  model: "model_name"  # 模型名称
  temperature: 0.4  # 生成随机性；值越低回答通常越稳定
  timeout_seconds: 45  # 单次模型请求超时秒数；超时不自动重试
  max_output_tokens: 60000  # 模型单次输出 token 上限，触顶可能截断回答
  vision_enabled: false  # 是否启用图片理解；模型须支持视觉，聊天和评论共用
  max_image_bytes: 5242880  # 单图下载字节上限，不得超过站点 10 MiB 限制

mcp:  # 外部工具总配置；查询可能发往对应上游，所有凭据只引用环境变量
  enabled: false  # 是否启用本模块；上级总开关也须开启
  connect_timeout_seconds: 10  # MCP 连接及工具发现超时秒数
  call_timeout_seconds: 20  # 单次 MCP 工具调用超时秒数
  reconnect_base_seconds: 3  # 断线重连的基础退避秒数
  reconnect_max_seconds: 60  # 断线重连的指数退避封顶秒数
  servers:  # MCP 上游服务定义；连接成功不等于开放全部工具
    exa:  # Exa 搜索服务；单 Key 与 account_pool 二选一，池配置见使用手册
      enabled: false  # 是否启用本模块；上级总开关也须开启
      transport: stdio  # stdio 为子进程，sse 为远程连接；两套字段互斥
      command: exa-mcp-server  # 已安装的 MCP 服务器启动命令，运行期不临时安装依赖
      args: []  # 子进程启动参数列表
      env_from:  # 子进程变量名到宿主变量名的映射，只写变量名，与 account_pool 互斥
        EXA_API_KEY: EXA_API_KEY  # 提供 Exa Key 的宿主环境变量名，不是密钥值
      env:  # 子进程非敏感环境变量；凭据只能通过 env_from 注入
        ENABLED_TOOLS: web_search_exa  # Exa 服务开放的工具；宿主仍会再次检查白名单
        DEBUG: "false"  # 上游子进程调试开关，独立于宿主日志级别
    amap:  # 高德地图服务；依赖版本统一由 mcp-tools.package.json 管理
      enabled: false  # 是否启用本模块；上级总开关也须开启
      transport: stdio  # stdio 为子进程，sse 为远程连接；两套字段互斥
      command: mcp-amap  # 已安装的 MCP 服务器启动命令，运行期不临时安装依赖
      args: []  # 子进程启动参数列表
      env_from:  # 子进程变量名到宿主变量名的映射，只写变量名，与 account_pool 互斥
        AMAP_MAPS_API_KEY: AMAP_MAPS_API_KEY  # 提供高德 Key 的宿主环境变量名，不是密钥值
    wolfram:  # Wolfram 计算服务；依赖版本统一由 mcp-tools.package.json 管理
      enabled: false  # 是否启用本模块；上级总开关也须开启
      transport: stdio  # stdio 为子进程，sse 为远程连接；两套字段互斥
      command: wolfram-mcp  # 已安装的 MCP 服务器启动命令，运行期不临时安装依赖
      args: []  # 子进程启动参数列表
      env_from:  # 子进程变量名到宿主变量名的映射，只写变量名，与 account_pool 互斥
        WOLFRAM_APP_ID: WOLFRAM_APP_ID  # 提供 Wolfram AppID 的宿主环境变量名，不是凭据值
    zhihu:  # 知乎远程 SSE 服务；缺凭据时只停用本服务
      enabled: false  # 是否启用本模块；上级总开关也须开启
      transport: sse  # stdio 为子进程，sse 为远程连接；两套字段互斥
      url: https://developer.zhihu.com/api/mcp/zhihu_search/v1/sse  # 远程 MCP SSE 地址，必须使用 HTTPS
      bearer_env: ZHIHU_ACCESS_SECRET  # 提供 Bearer 令牌的宿主环境变量名，不是令牌值
      stream_read_timeout_seconds: 300  # MCP SSE 读超时秒数，独立于单次调用超时
  features:  # 产品能力及工具白名单；聊天命令只授权本轮，评论不调用 MCP
    search:  # 聊天 /search 能力，仅允许 Exa 搜索
      enabled: false  # 是否启用本模块；上级总开关也须开启
      bindings:  # 本能力允许调用的工具绑定；全部绑定就绪才可用
        - server: exa  # 引用 servers 中定义的服务器名称
          tool: web_search_exa  # 允许调用的精确上游工具名
      result_count: 5  # 单次工具调用最多返回的结果条目数
      result_item_token_limit: 3000  # 当前轮每条工具结果的估算 token 上限
      history_item_token_limit: 500  # 成功回答后每条结果保留在历史中的摘要 token 上限
      max_query_chars: 500  # 查询参数的字符上限，还须满足能力表的硬上界
      max_tool_calls_per_turn: 1  # 单轮工具调用预算，不代表支持多步研究循环
      max_concurrency: 1  # 此能力全部绑定共享的工具调用并发上限
      min_interval_seconds: 2  # 此能力全部绑定共享的最小调用间隔秒数
    zhihu:  # 聊天 /zhihu 能力；部署前须核对真实返回样本
      enabled: false  # 是否启用本模块；上级总开关也须开启
      bindings:  # 本能力允许调用的工具绑定；全部绑定就绪才可用
        - server: zhihu  # 引用 servers 中定义的服务器名称
          tool: zhihu_search  # 允许调用的精确上游工具名
      result_count: 5  # 单次工具调用最多返回的结果条目数
      result_item_token_limit: 3000  # 当前轮每条工具结果的估算 token 上限
      history_item_token_limit: 500  # 成功回答后每条结果保留在历史中的摘要 token 上限
      max_query_chars: 100  # 查询参数的字符上限，还须满足能力表的硬上界
      max_tool_calls_per_turn: 1  # 单轮工具调用预算，不代表支持多步研究循环
      max_concurrency: 1  # 此能力全部绑定共享的工具调用并发上限
      min_interval_seconds: 2  # 此能力全部绑定共享的最小调用间隔秒数
    map:  # 聊天 /map 能力；全部绑定均就绪才可用
      enabled: false  # 是否启用本模块；上级总开关也须开启
      bindings:  # 本能力允许调用的工具绑定；全部绑定就绪才可用
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_geo  # 允许调用的精确上游工具名
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_text_search  # 允许调用的精确上游工具名
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_weather  # 允许调用的精确上游工具名
      result_count: 1  # 单次工具调用最多返回的结果条目数
      result_item_token_limit: 3000  # 当前轮每条工具结果的估算 token 上限
      history_item_token_limit: 500  # 成功回答后每条结果保留在历史中的摘要 token 上限
      max_query_chars: 100  # 查询参数的字符上限，还须满足能力表的硬上界
      max_tool_calls_per_turn: 1  # 单轮工具调用预算，不代表支持多步研究循环
      max_concurrency: 1  # 此能力全部绑定共享的工具调用并发上限
      min_interval_seconds: 2  # 此能力全部绑定共享的最小调用间隔秒数
    wolfram:  # 聊天 /wolfram 能力；返回一条完整答案
      enabled: false  # 是否启用本模块；上级总开关也须开启
      bindings:  # 本能力允许调用的工具绑定；全部绑定就绪才可用
        - server: wolfram  # 引用 servers 中定义的服务器名称
          tool: wolfram_query  # 允许调用的精确上游工具名
      result_count: 1  # 完整答案型结果，必须为 1
      result_item_token_limit: 3000  # 当前轮每条工具结果的估算 token 上限
      history_item_token_limit: 500  # 成功回答后每条结果保留在历史中的摘要 token 上限
      max_query_chars: 300  # 查询参数的字符上限，还须满足能力表的硬上界
      max_tool_calls_per_turn: 1  # 单轮工具调用预算，不代表支持多步研究循环
      max_concurrency: 1  # 此能力全部绑定共享的工具调用并发上限
      min_interval_seconds: 2  # 此能力全部绑定共享的最小调用间隔秒数
    blog_write:  # 发文取材，无聊天命令；绑定未全部就绪时退回无工具生成
      enabled: false  # 是否启用本模块；上级总开关也须开启
      bindings:  # 本能力允许调用的工具绑定；全部绑定就绪才可用
        - server: exa  # 引用 servers 中定义的服务器名称
          tool: web_search_exa  # 允许调用的精确上游工具名
        - server: zhihu  # 引用 servers 中定义的服务器名称
          tool: zhihu_search  # 允许调用的精确上游工具名
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_geo  # 允许调用的精确上游工具名
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_text_search  # 允许调用的精确上游工具名
        - server: amap  # 引用 servers 中定义的服务器名称
          tool: maps_weather  # 允许调用的精确上游工具名
        - server: wolfram  # 引用 servers 中定义的服务器名称
          tool: wolfram_query  # 允许调用的精确上游工具名
      result_count: 1  # 发文取材固定为 1 条结果
      result_item_token_limit: 3000  # 当前轮每条工具结果的估算 token 上限
      history_item_token_limit: 500  # 兼容工具结果的历史摘要上限；发文不提交聊天历史
      max_query_chars: 500  # 查询参数的字符上限，还须满足能力表的硬上界
      max_tool_calls_per_turn: 1  # 整篇生成的工具预算；当前写作流程至多执行一次工具
      max_concurrency: 1  # 此能力全部绑定共享的工具调用并发上限
      min_interval_seconds: 2  # 此能力全部绑定共享的最小调用间隔秒数

behavior:  # 聊天上下文、输入输出、并发与配额
  context_turns: 10  # 每个会话保留的完整对话轮数
  context_input_tokens: 8000  # 文字上下文的估算 token 预算；图片成本另行限制
  max_input_chars: 8000  # 剥离提及和命令后的输入字符上限
  quoted_blog_max_chars: 1000  # 引用博客正文的字符上限，超长时只提供标题和说明
  content_ref_max_chars: 2000  # 单条引用展开字符上限，同时约束消息和评论正文的展开总预算
  max_output_chars: 5000  # 出站字符上限，超出时按自然段截断并添加后缀
  concurrency: 3  # 聊天 worker 数，也是共享模型并发闸门容量
  queue_size: 50  # 待处理请求队列的最大长度
  minute_attempt_limit: 100  # 每分钟滑动窗口的本地发送限额，含在途预留
  daily_normal_limit: 7950  # 聊天总发送数达到此滚动 24 小时阈值后停止模型回复
  daily_absolute_limit: 8000  # 滚动 24 小时总发送上限，包含模型回复和本地回复
  notice_cooldown_seconds: 300  # 主动通知按频道与触发者冷却的秒数，本地命令回复不受此限
  reconnect_base_seconds: 3.0  # 断线重连的基础退避秒数
  reconnect_max_seconds: 60.0  # 站点 SSE 指数退避封顶秒数，随后还会叠加随机抖动
  ready_probe_seconds: 300.0  # 站点权限或禁言恢复探测的间隔秒数
  rate_limit_wait_seconds: 60.0  # 429 未给出明确等待时间时的默认退避秒数

ops:  # 只返回固定短文本的存活与就绪探针
  host: "0.0.0.0"  # 健康探针监听地址；外部访问由部署端口映射决定
  port: 8080  # 健康探针端口，提供 /livez 与 /readyz

storage:  # SQLite 运行状态；不存消息正文，发文标题例外见 D-107
  db_path: "./data/bot.db"  # SQLite 文件路径，同目录须允许创建 WAL 和 SHM 文件
  lobby_thread_retention_seconds: 604800  # 大区回复链无活动后的保留秒数
  cleanup_interval_seconds: 3600  # 状态清理间隔秒数，不得超过大区链保留时间
  send_attempt_retention_seconds: 172800  # 发送记录保留秒数，至少覆盖滚动 24 小时窗口
  max_dm_channels: 10000  # 最多保留的已知私聊频道数，优先保留最近活动频道
  sqlite_soft_limit_bytes: 134217728  # SQLite 主库软容量阈值，单位字节；超限只告警
  wal_journal_limit_bytes: 16777216  # WAL journal_size_limit 字节数，须小于主库软阈值

logging:  # 白名单结构化日志；凭据统一脱敏，禁止写入正文
  level: "INFO"  # 日志级别；DEBUG 也不允许记录正文或凭据

system_prompt: |  # 聊天系统提示词；以下多行是实际发送内容，不在正文中添加 YAML 注释
  你是站内通用聊天机器人。明确自己的机器人身份，
  跟随用户语言，保持简洁友好，不代表站方作正式承诺。

knowledge_base:  # 本地只读 Markdown 检索；命中内容会发送给模型，目录须经授权清点
  enabled: false  # 是否启用本模块；上级总开关也须开启
  root_dir: "./knowledge"  # 知识库根目录，容器中应只读挂载
  access_mode: allowlist  # allowlist 按用户和频道名单限制；all_chat 显式开放聊天范围
  allowed_channel_kinds:  # allowlist 模式允许的频道；dm 为私聊，lobby 为大区
    - dm  # 允许的频道类型；dm 为私聊，lobby 为大区
  allowed_user_ids: []  # allowlist 模式允许的稳定用户 ID，不能填可修改的用户名
  refresh_seconds: 60  # 读取或重建快照的间隔秒数
  max_files: 2000  # 知识库扫描允许纳入的文件数量上限
  max_file_bytes: 1048576  # 本模块单个 Markdown 文件的字节数上限
  max_total_bytes: 67108864  # 知识库纳入文件的总字节数上限
  chunk_chars: 2400  # 检索分块目标字符数
  chunk_overlap_chars: 200  # 相邻块重叠字符数，须小于块长
  top_k: 6  # 每次检索最多选取的片段数
  max_context_tokens: 4000  # 单轮 KB 资料 token 上限，不得超过聊天上下文预算

comments:  # 博客评论子系统；独立队列与配额，共享模型并发闸门
  enabled: false  # 是否启用评论机器人；成功评论会真实通知被回复者
  recent_poll_seconds: 30  # 轮询全站最近评论的间隔秒数
  notification_poll_seconds: 15  # 轮询评论回复通知的间隔秒数
  notification_max_pages: 5  # 每轮通知读取页数上限；尾页未读尽时不完成冷启动基线
  queue_size: 50  # 待处理请求队列的最大长度
  concurrency: 1  # 处理请求的 worker 数
  context_turns: 10  # 每个会话保留的完整对话轮数
  context_input_tokens: 8000  # 文字上下文的估算 token 预算；图片成本另行限制
  article_max_chars: 1000  # 文章正文可提供给模型的字符上限；超长只提供标题
  max_images_per_reply: 3  # 每轮图片尝试名额；附件、评论引用、文章引用依次共用，失败也扣减，0 为不取图
  max_output_chars: 5000  # 出站字符上限，超出时按自然段截断并添加后缀
  max_response_bytes: 8388608  # 评论及相关读取响应的最大字节数，防止超大数据占满内存
  max_tree_nodes: 10000  # 完整评论树节点上限；超限不能使用截断前缀
  unmatched_attempt_limit: 5  # 通知成功读树后仍找不到匹配目标的尝试次数上限
  minute_attempt_limit: 20  # 每分钟滑动窗口的本地发送限额，含在途预留
  daily_reply_limit: 7950  # 滚动 24 小时模型评论回复数量上限，仅统计 reply
  daily_absolute_limit: 8000  # 滚动 24 小时评论总上限，含本地回复；不得超过 8000
  article_cooldown_seconds: 5  # 同一文章两次评论发送的最小间隔秒数
  conversation_retention_seconds: 2592000  # 评论会话映射保留秒数，过期同步作废内存上下文
  dedupe_retention_seconds: 7776000  # 评论去重、已发回复与通知终态的保留秒数
  retry_base_seconds: 5  # 评论轮询或恢复失败后的基础退避秒数
  retry_max_seconds: 300  # 评论重试退避的最大秒数
  server_backoff_seconds: 3600  # 评论遇到站点限制时的默认退避秒数

memory:  # 长期记忆 Beta；正文存授权 Markdown，公开与私有读取严格隔离
  enabled: false  # 是否装配长期记忆；关闭时不读目录、不启记忆任务

  access_mode: "allowlist"  # allowlist 限名单，all 开放接入；共同记忆管理权仍单独控制
  allow_user_list: []  # 记忆接入名单，填写稳定用户 ID
  admin_user_list: []  # 共同记忆管理员 ID；allowlist 模式须为接入名单子集

  root_dir: "./data/memory"  # 记忆根目录，包含 common.md、users/、public/；只支持单进程写入
  refresh_seconds: 10  # 读取或重建快照的间隔秒数
  queue_size: 20  # 待处理请求队列的最大长度

  max_common_entries_per_scope: 64  # 每个共同记忆作用域的生效条目上限
  max_private_entries_per_user: 32  # 每位用户的私有记忆条目上限
  max_candidates: 128  # 共同记忆待审批候选总数上限，满额不静默删除
  max_entry_chars: 500  # 单条记忆正文的字符上限
  max_file_bytes: 262144  # 本模块单个 Markdown 文件的字节数上限
  max_operations: 512  # 每份记忆文件保留的业务幂等操作记录上限

  common_context_tokens: 800  # all_user 和 lobby 共同记忆合计的单轮 token 上限
  private_context_tokens: 800  # 所属用户私有记忆的单轮 token 上限
  writer_context_tokens: 2000  # 记忆撰写整份请求的 token 上限，包含 system、来源及既有条目
  writer_timeout_seconds: 15  # 获取并发名额后，单次记忆撰写的超时秒数

  max_public_entries_per_user: 8  # 每位用户公开条目上限，不得超过私有条目上限
  max_public_subjects_per_turn: 4  # 每轮最多纳入的公开记忆 owner 数
  public_personal_context_tokens: 600  # 公开个人记忆资料组的单轮 token 上限

  auto_capture_available: false  # 部署是否允许自动记忆；用户仍需在私聊中主动开启

blog:  # UTC+8 定时自动发文；普通用户接口例外，真实站点验收见 USAGE.md
  enabled: false  # 是否启动发文扫描、生成与对账；开启时至少配置一个任务

  max_posts_per_day: 3  # 机器人本地每日投递上限，范围 1–5；不确定记录跨日持续占额

  tasks:  # 发文任务列表，每项只能选择 prompt 或 drafts_dir 之一
    - name: "晨间随笔"  # 任务持久标识，必须唯一；改名等同新任务
      tier: must  # must 到点发起，maybe 按概率决定；均受预算和校验限制
      schedule: ["09:00"]  # UTC+8 的 HH:MM 调度点列表，同任务不得重复，停机错过不补发
      category_id: 12  # 栏目整数 ID，null 为未分类；由维护者核对填写
      prompt: |  # 现写任务提示词，作为 user 内容交给模型；多行正文中不添加 YAML 注释
        写一篇晨间随笔，语气平和，400 字左右。
        可以先用一次搜索工具取一点当天的素材。

    - name: "每日新闻速览"  # 任务持久标识，必须唯一；改名等同新任务
      tier: maybe  # must 到点发起，maybe 按概率决定；均受预算和校验限制
      probability: 0.99  # maybe 每个调度点的执行概率，须大于 0 且不超过 1
      schedule: ["20:10"]  # UTC+8 的 HH:MM 调度点列表，同任务不得重复，停机错过不补发
      category_id: 7  # 栏目整数 ID，null 为未分类；由维护者核对填写
      prompt: |  # 现写任务提示词，作为 user 内容交给模型；多行正文中不添加 YAML 注释
        调用搜索工具，简述每天国内国际新闻。
  
    - name: "连载"  # 任务持久标识，必须唯一；改名等同新任务
      tier: must  # must 到点发起，maybe 按概率决定；均受预算和校验限制
      schedule: ["20:18"]  # UTC+8 的 HH:MM 调度点列表，同任务不得重复，停机错过不补发
      category_id: 5  # 栏目整数 ID，null 为未分类；由维护者核对填写
      drafts_dir: ./drafts  # 稿库目录，相对本配置文件解析；按文件名选稿，与 prompt 互斥
