# Raricy 站内聊天机器人配置示例。
# 复制为 config.yaml 后按需修改；也可以用 BOT_CONFIG_PATH 指定其他路径。
#
# 密钥不写在本文件里，一律通过环境变量提供：
#   RARICY_USERNAME   站点登录用户名
#   RARICY_PASSWORD   站点登录密码
#   LLM_API_KEY       模型服务的 API Key
#   EXA_API_KEY       Exa MCP API Key（仅启用 mcp.enabled 时需要）
#   EXA_API_KEY_1..N  多 Key 池模式下的各槽位 Key（可选；见下面的 account_pool）
#   AMAP_MAPS_API_KEY    高德地图 Web 服务 Key（仅启用 map 能力时需要）
#   WOLFRAM_APP_ID       Wolfram AppID（仅启用 wolfram 能力时需要）
#   ZHIHU_ACCESS_SECRET  知乎开放平台访问密钥（仅启用 zhihu 能力时需要）
# RARICY_USERNAME、RARICY_PASSWORD、LLM_API_KEY 缺失或为空时程序会直接以配置错误退出；
# 其余四个 MCP 密钥缺失时只停用对应的那一个服务器，普通聊天与其它能力不受影响。

site:
  base_url: "https://example.com"
  request_timeout_seconds: 20

model:
  base_url: "https://provider.example/v1"
  model: "configured-model-name"
  temperature: 0.4
  timeout_seconds: 45
  max_output_tokens: 600
  # 图片输入默认关闭。仅当本模型确实支持视觉时才打开：否则每一条带图的消息
  # 都会以 400 失败并回一条失败提示。开启后聊天区与博客区都获得识图能力，
  # 评论侧另有自己的名额（comments.max_images_per_reply）。
  vision_enabled: false
  # 单张图的下载期硬上限（字节），不得超过站点图床的 10 MiB 上限。
  max_image_bytes: 5242880

# MCP 能力默认关闭。启用后，聊天区的 `/search`、`/zhihu`、`/map`、`/wolfram` 四条命令
# 各自把当前轮交给模型判断是否调用对应的上游工具；评论区永远不会获得 MCP 工具。
# 一条消息最多只能带一个能力命令，叠加会被本地拒绝。
# 密钥不写在 YAML 中：env_from 与 bearer_env 的值都只是宿主环境变量名，实际值由环境注入。
mcp:
  enabled: false
  connect_timeout_seconds: 10
  call_timeout_seconds: 20
  reconnect_base_seconds: 3
  reconnect_max_seconds: 60
  servers:
    exa:
      enabled: true
      transport: stdio
      # Docker 镜像在构建期固定安装 exa-mcp-server@3.4.1，运行期不执行 npx/npm。
      command: exa-mcp-server
      args: []
      # 单 Key 形态：把宿主环境变量映射进子进程。它与下面的 account_pool 互斥，
      # 二者只能留一个。
      env_from:
        EXA_API_KEY: EXA_API_KEY
      # 多 Key 池形态（可选）。把上面两行 env_from 注释掉，再打开这一段即可：
      # 每个槽位一个独立子进程，一次逻辑搜索按轮询在槽位间做有界故障转移。
      # host_envs 里写的是**环境变量名**，不是 Key 值；真实值只在运行时从宿主环境读取，
      # 从不写进 YAML、日志或数据库。
      #
      # 上线前必须确认这些 Key 都已获得 Exa 授权（见 docs/usage/DEPLOYMENT.md
      # 的「Exa 授权合规门禁」）。池不会绕过平台额度政策。
      #
      # account_pool:
      #   child_env: EXA_API_KEY
      #   host_envs:
      #     - EXA_API_KEY_1
      #     - EXA_API_KEY_2
      #     - EXA_API_KEY_3
      #   strategy: round_robin
      #   rate_limit_cooldown_seconds: 60
      #   transient_cooldown_seconds: 30
      #   quota_cooldown_seconds: 21600
      env:
        ENABLED_TOOLS: web_search_exa
        DEBUG: "false"
    # 高德地图（stdio 子进程，Docker 镜像在构建期固定安装
    # @amap/amap-maps-mcp-server@0.0.8）。
    # 密钥走 env_from 映射，值只在运行时从宿主环境读取。缺密钥时子进程不会启动，
    # 只有 /map 报不可用，其它能力不受影响。
    amap:
      enabled: true
      transport: stdio
      command: mcp-amap
      args: []
      env_from:
        AMAP_MAPS_API_KEY: AMAP_MAPS_API_KEY
    # Wolfram（stdio 子进程，构建期固定安装 wolfram-mcp@1.1.2）。
    # WOLFRAM_APP_ID 同样是映射，不是取值，不允许明文写在 env: 里。
    wolfram:
      enabled: true
      transport: stdio
      command: wolfram-mcp
      args: []
      env_from:
        WOLFRAM_APP_ID: WOLFRAM_APP_ID
    # 知乎这条走 SSE 传输：没有子进程，因此 command/args/env/env_from/account_pool
    # 一律不允许出现。
    # bearer_env 是宿主环境变量名，值是 Bearer 令牌，只在建连时读取并立即登记脱敏。
    zhihu:
      enabled: true
      transport: sse
      url: https://developer.zhihu.com/api/mcp/zhihu_search/v1/sse
      bearer_env: ZHIHU_ACCESS_SECRET
      # 长连接的读侧超时，不能沿用 call_timeout_seconds：安静期比它长就会被判成
      # 超时并重连。
      stream_read_timeout_seconds: 300
  features:
    search:
      enabled: true
      bindings:
        - server: exa
          tool: web_search_exa
      result_count: 5
      result_item_token_limit: 3000
      history_item_token_limit: 500
      max_query_chars: 500
      max_tool_calls_per_turn: 1
      max_concurrency: 1
      min_interval_seconds: 2
    # 以下三个能力默认关闭，启用前必须先取真实样本校准：按 docs/usage/DEPLOYMENT.md
    # 的「上游取样」一节跑一次 tools/capture_mcp_fixture.py。
    #
    # 三个能力的 max_query_chars 上限由能力表钉死：zhihu 100（上游只收 2..100 字符）、
    # map 100、wolfram 300。写超了会在加载期直接报配置错误。
    zhihu:
      enabled: false
      bindings:
        - server: zhihu
          tool: zhihu_search
      result_count: 5
      result_item_token_limit: 3000
      history_item_token_limit: 500
      max_query_chars: 100
      max_tool_calls_per_turn: 1
      max_concurrency: 1
      min_interval_seconds: 2
    # 三个绑定是「全有或全无」：任一工具在发现阶段缺失，整个 /map 判为不可用。
    map:
      enabled: false
      bindings:
        - server: amap
          tool: maps_geo
        - server: amap
          tool: maps_text_search
        - server: amap
          tool: maps_weather
      result_count: 5
      result_item_token_limit: 3000
      history_item_token_limit: 500
      max_query_chars: 100
      max_tool_calls_per_turn: 1
      max_concurrency: 1
      min_interval_seconds: 2
    # wolfram 是「整条答案」型（single）：result_count 必须为 1，配成别的值会在
    # 加载期报错。这里的 result_item_token_limit 是**整条答案**的上限，
    # history_item_token_limit 是它跨轮摘要的上限。
    wolfram:
      enabled: false
      bindings:
        - server: wolfram
          tool: wolfram_query
      result_count: 1
      result_item_token_limit: 3000
      history_item_token_limit: 500
      max_query_chars: 300
      max_tool_calls_per_turn: 1
      max_concurrency: 1
      min_interval_seconds: 2

behavior:
  context_turns: 10
  context_input_tokens: 8000
  max_input_chars: 8000
  # 消息里引用的博客正文，交给模型的最多字符数（按 Unicode 字符数）。
  # 超限时只给标题并写明原因，与 comments.article_max_chars 的规则一致。
  quoted_blog_max_chars: 1000
  # 正文里的内容引用 `[@<内容ID>]`（8 位剪贴板 / 9 位投票 / 10 位图床）展开出来的
  # 单条字符上限；它同时是消息正文与评论正文展开时的总预算。
  # 引用博客正文与文章正文另有总预算（见上一条与 comments.article_max_chars）。
  # 调大它意味着更多别人写的内容会被送进模型，按自己的模型上下文与成本决定。
  content_ref_max_chars: 2000
  max_output_chars: 5000
  concurrency: 3
  queue_size: 50
  minute_attempt_limit: 100
  daily_normal_limit: 7950
  daily_absolute_limit: 8000
  notice_cooldown_seconds: 300
  reconnect_base_seconds: 3.0
  reconnect_max_seconds: 60.0
  ready_probe_seconds: 300.0
  rate_limit_wait_seconds: 60.0

ops:
  host: "0.0.0.0"
  port: 8080

# 本配置文件有 1 MiB 硬上限（代码常量，不可在此调整）：超过时进程在启动阶段
# 直接以配置错误退出，不会部分启动。
storage:
  db_path: "./data/bot.db"
  # 大区共享链映射保留 7 天；7 天无活动即过期。
  lobby_thread_retention_seconds: 604800
  # 运行期清理周期，必须 <= lobby_thread_retention_seconds。
  cleanup_interval_seconds: 3600
  # 发送尝试记录保留 48 小时（覆盖滚动 24 小时配额窗口），不得小于 86400。
  send_attempt_retention_seconds: 172800
  # 已知私聊频道只保留最近活动的这么多条。
  max_dm_channels: 10000
  # SQLite 主库软上限（只告警，不硬截断）；需要收缩时由运维停机 VACUUM。
  sqlite_soft_limit_bytes: 134217728
  # WAL 的 journal_size_limit，必须小于 sqlite_soft_limit_bytes。
  wal_journal_limit_bytes: 16777216

logging:
  level: "INFO"

system_prompt: |
  你是站内通用聊天机器人。明确自己的机器人身份，
  跟随用户语言，保持简洁友好，不代表站方作正式承诺。

# 本地 Markdown 知识库默认关闭。启用后，聊天区的显式 `/kb <问题>` 会从 root_dir
# 递归读取 .md 文件并检索；命中的片段会随当前轮问题一起发送给第三方模型。
# 默认只允许私聊，且只允许 allowed_user_ids 中列出的站点用户 id；要在大区公开使用
# 必须显式写 access_mode: all_chat（大厅仍需精确 @ 机器人）。
# 上线前必须完成挂载目录的人工清点，确认其中没有密钥、隐私或无权转交模型的内容。
knowledge_base:
  enabled: false
  # 容器部署时这是只读挂载点；不要把它放在镜像里或可写数据卷里。
  root_dir: "./knowledge"
  access_mode: allowlist
  allowed_channel_kinds:
    - dm
  allowed_user_ids: []
  refresh_seconds: 60
  max_files: 2000
  max_file_bytes: 1048576
  max_total_bytes: 67108864
  chunk_chars: 2400
  chunk_overlap_chars: 200
  top_k: 6
  # 必须 <= behavior.context_input_tokens。
  max_context_tokens: 4000

# 博客评论机器人默认关闭；启用前请确认机器人资料已披露第三方模型处理。
comments:
  enabled: false
  recent_poll_seconds: 30
  notification_poll_seconds: 15
  notification_max_pages: 5
  queue_size: 50
  concurrency: 1
  context_turns: 10
  context_input_tokens: 8000
  article_max_chars: 1000
  # 一轮评论回复最多交给模型几张图，附件与两处正文里的 `[@10位]` 引用共用这一个
  # 名额：评论附件 → 评论正文的引用 → 文章正文的引用，按这个顺序花。
  # 0 表示评论侧不取图（聊天区不受影响）；整体关闭用 model.vision_enabled。
  # 图片不计入上面的 context_input_tokens（那是文字预算），名额本身就是它们的成本上限。
  max_images_per_reply: 3
  max_output_chars: 5000
  max_response_bytes: 8388608
  max_tree_nodes: 10000
  unmatched_attempt_limit: 5
  minute_attempt_limit: 20
  daily_reply_limit: 7950
  daily_absolute_limit: 8000
  article_cooldown_seconds: 5
  conversation_retention_seconds: 2592000
  dedupe_retention_seconds: 7776000
  retry_base_seconds: 5
  retry_max_seconds: 300
  server_backoff_seconds: 3600

# 长期记忆目前为 Beta。默认关闭；启用后仍默认无人可用。
memory:
  enabled: false

  # allowlist：只有 allow_user_list 中的用户能使用任何记忆能力。
  # all：所有用户都能使用；共同记忆管理权仍只属于 admin_user_list。
  access_mode: "allowlist"
  allow_user_list: []
  admin_user_list: []

  root_dir: "./data/memory"
  refresh_seconds: 10
  queue_size: 20

  max_common_entries_per_scope: 64
  max_private_entries_per_user: 32
  max_candidates: 128
  max_entry_chars: 500
  max_file_bytes: 262144
  max_operations: 512

  # 记忆自己的 token 上限：共同记忆（all_user 与 lobby）合计使用这一份，私有记忆各一份。
  # 超过上限的条目整条跳过（不截断），记忆因此不会把整轮预算吃光、把历史挤掉。
  common_context_tokens: 800
  private_context_tokens: 800
  writer_context_tokens: 2000
  writer_timeout_seconds: 15

  # 公开个人记忆（用户把自己的一条私有记忆发布到大区与评论可见的公开投影）：
  # 单个 owner 的公开条目上限、一轮最多选入的 owner 数、公开个人记忆分组的渲染上限。
  # `max_public_entries_per_user` 不能大于 `max_private_entries_per_user`。
  max_public_entries_per_user: 8
  max_public_subjects_per_turn: 4
  public_personal_context_tokens: 600

  # 部署允许后，用户仍需在私聊中主动开启自动记忆。
  auto_capture_available: false

# 定时发文（设计 BLOG_PUBLISH_DESIGN.md §4，内部合同 INTERFACES.md §53）。
# 机器人以自己的账号、按固定 UTC+8 的调度点自动发布博客文章，默认整段关闭。
# 两条来源产出的都是同一种草稿（YAML front matter + Markdown 正文）：
#   - 现写型：写 prompt，到点让模型写一篇；
#   - 稿库型：写 drafts_dir，到点从目录里按文件名顺序取一篇。
# tier=must 到点必发起；tier=maybe 到点按 probability 掷一次骰。
# 注意：这里没有 Web 界面，任务的增删改一律走本文件（也就是走版本控制）。
blog:
  enabled: false

  # 本地日预算，1..5，默认 2。只约束「本机器人记录的投递」；同账号在网页上手工发文
  # 一样占站方的 20 篇/日额度，所以远端 429 仍必须处理。
  # 结果不确定的行跨 UTC+8 午夜**持续占用额度**，不会在零点释放 —— 详见 USAGE.md。
  max_posts_per_day: 2

  # 任务表。enabled 为 true 时必须至少有一个任务；关闭时留空是合法的。
  #
  # 字段（`prompt` 与 `drafts_dir` 必须**恰好给一个**）：
  #   name         任务名，非空、全局唯一；它是持久标识，**改名等同新建一个任务**
  #   tier         must | maybe
  #   schedule     "HH:MM" 列表，按 UTC+8 解释，同任务内不得重复
  #   prompt       现写型的任务提示词（多行用 YAML 的 `|`）
  #   drafts_dir   稿库型：稿件目录，相对路径以**本配置文件所在目录**为基准
  #   category_id  公开栏目 id；留空即「未分类」。站点没有公开的栏目列表接口，
  #                叶子栏目的 id 拿不到，只能人工填父栏目的 id（见设计 §2.2）
  #   probability  仅 maybe 使用且必填，(0, 1]
  tasks: []

  # 用法示例（整段取消注释后按需修改）：
  #
  # tasks:
  #   - name: "晨间随笔"
  #     tier: must
  #     schedule: ["09:00"]
  #     category_id: 12
  #     prompt: |
  #       写一篇晨间随笔，语气平和，400 字左右。
  #       可以先用一次搜索工具取一点当天的素材。
  #
  #   - name: "偶发感想"
  #     tier: maybe
  #     probability: 0.3
  #     schedule: ["21:30"]
  #     category_id: 7
  #     prompt: |
  #       写一段随想。
  #
  #   - name: "连载"
  #     tier: must
  #     schedule: ["20:00"]
  #     category_id: 5
  #     drafts_dir: ./drafts/serial
