# Raricy 站内聊天机器人配置示例。
# 复制为 config.yaml 后按需修改；也可以用 BOT_CONFIG_PATH 指定其他路径。
#
# 密钥不写在本文件里，一律通过环境变量提供：
#   RARICY_USERNAME   站点登录用户名
#   RARICY_PASSWORD   站点登录密码
#   LLM_API_KEY       模型服务的 API Key
# 缺失或为空时程序会直接以配置错误退出。

site:
  base_url: "https://example.com"
  request_timeout_seconds: 20

model:
  base_url: "https://provider.example/v1"
  model: "configured-model-name"
  temperature: 0.4
  timeout_seconds: 45
  max_output_tokens: 600

behavior:
  context_turns: 10
  context_input_tokens: 8000
  max_input_chars: 8000
  max_output_chars: 5000
  concurrency: 3
  queue_size: 50
  minute_attempt_limit: 25
  daily_normal_limit: 1950
  daily_absolute_limit: 2000
  notice_cooldown_seconds: 300
  reconnect_base_seconds: 3.0
  reconnect_max_seconds: 60.0
  ready_probe_seconds: 300.0
  rate_limit_wait_seconds: 60.0

ops:
  host: "0.0.0.0"
  port: 8080

# 本配置文件有 1 MiB 硬上限（代码常量，不可在此调整）：超过时进程在启动阶段
# 直接以配置错误退出，不会部分启动。
storage:
  db_path: "./data/bot.db"
  # 大区共享链映射保留 7 天；7 天无活动即过期。
  lobby_thread_retention_seconds: 604800
  # 运行期清理周期，必须 <= lobby_thread_retention_seconds。
  cleanup_interval_seconds: 3600
  # 发送尝试记录保留 48 小时（覆盖滚动 24 小时配额窗口），不得小于 86400。
  send_attempt_retention_seconds: 172800
  # 已知私聊频道只保留最近活动的这么多条。
  max_dm_channels: 10000
  # SQLite 主库软上限（只告警，不硬截断）；需要收缩时由运维停机 VACUUM。
  sqlite_soft_limit_bytes: 134217728
  # WAL 的 journal_size_limit，必须小于 sqlite_soft_limit_bytes。
  wal_journal_limit_bytes: 16777216

logging:
  level: "INFO"

system_prompt: |
  你是站内通用聊天机器人。明确自己的机器人身份，
  跟随用户语言，保持简洁友好，不代表站方作正式承诺。

# 博客评论机器人默认关闭；启用前请确认机器人资料已披露第三方模型处理。
comments:
  enabled: false
  recent_poll_seconds: 30
  notification_poll_seconds: 15
  notification_max_pages: 5
  queue_size: 50
  concurrency: 1
  context_turns: 10
  context_input_tokens: 8000
  article_max_chars: 1000
  max_output_chars: 5000
  max_response_bytes: 8388608
  max_tree_nodes: 10000
  unmatched_attempt_limit: 5
  minute_attempt_limit: 20
  daily_reply_limit: 1950
  daily_absolute_limit: 2000
  article_cooldown_seconds: 5
  conversation_retention_seconds: 2592000
  dedupe_retention_seconds: 7776000
  retry_base_seconds: 5
  retry_max_seconds: 300
  server_backoff_seconds: 3600
