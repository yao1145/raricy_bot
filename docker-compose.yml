# 单副本部署（设计文档 §2.2：仅运行一个机器人实例）。
# 密钥一律通过环境变量传入，本文件不得出现任何真实取值。
# 使用前：
#   export RARICY_USERNAME=...
#   export RARICY_PASSWORD=...
#   export LLM_API_KEY=...
#   export EXA_API_KEY=...       # 仅启用 mcp.enabled 时需要；不要写进本文件
#   # 多 Key 池（可选）：逐个显式导出，不要在命令行里拼接或打印
#   export EXA_API_KEY_1=...
#   export EXA_API_KEY_2=...
#   # 以下三个只在启用对应能力时才需要；缺失只会停用那一个能力
#   export AMAP_MAPS_API_KEY=... # /map
#   export WOLFRAM_APP_ID=...    # /wolfram
#   export ZHIHU_ACCESS_SECRET=...# /zhihu（先读 docs/usage/DEPLOYMENT.md 的取样一节）
#   docker compose up -d
services:
  bot:
    build: .
    image: raricy-bot:latest
    restart: unless-stopped
    # 应用状态只写入 /app/data 命名卷；其余镜像文件系统保持只读。
    read_only: true
    environment:
      # 容器内固定读取只读挂载的配置。
      BOT_CONFIG_PATH: /app/config.yaml
      # 站点与模型凭据只从宿主环境透传，缺省为空由程序以配置错误退出。
      RARICY_USERNAME: ${RARICY_USERNAME}
      RARICY_PASSWORD: ${RARICY_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      # 只透传给容器，由配置中的 env_from 再交给 Exa MCP 子进程；不写入 YAML。
      EXA_API_KEY: ${EXA_API_KEY}
      # 多 Key 池的逐个透传。Compose 不会自动带入宿主变量，必须显式列出；
      # 变量名与 config.yaml 的 mcp.servers.exa.account_pool.host_envs 必须一致。
      # 不用时把这三行删掉或留空（留空只会禁用对应槽位，不影响单 Key 形态）。
      EXA_API_KEY_1: ${EXA_API_KEY_1:-}
      EXA_API_KEY_2: ${EXA_API_KEY_2:-}
      EXA_API_KEY_3: ${EXA_API_KEY_3:-}
      # 另三个 MCP 服务器的凭据。同样只透传给容器，再由配置里的 env_from / bearer_env
      # 交给对应的子进程或 SSE 连接；变量名必须与 config.yaml 里写的**完全一致**。
      # 留空只会让那一个能力判为不可用，不影响普通聊天与其它能力。
      AMAP_MAPS_API_KEY: ${AMAP_MAPS_API_KEY:-}
      WOLFRAM_APP_ID: ${WOLFRAM_APP_ID:-}
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:-}
    volumes:
      # 配置只读挂载；其中 storage.db_path 用默认的 ./data/bot.db 即可。
      - ./config.yaml:/app/config.yaml:ro
      # 知识库：只读挂载，容器 UID 10001 只需可读，绝不给写权限。
      # Rocky/RHEL 上启用 SELinux 时再加 :Z 后缀（先按部署文档实测标签影响）。
      # 不要把它复制进镜像：镜像层里的旧资料会一直留在那里。
      # 不用知识库时保留这一行也无害（目录不存在只会让 KB 标为不可用）。
      - ./knowledge:/app/knowledge:ro
      # 数据目录不变量：容器 WORKDIR 为 /app，配置默认 storage.db_path=./data/bot.db
      # 解析为 /app/data/bot.db，所以卷必须挂在 /app/data，默认配置才能开箱持久化。
      # 若改成别的路径（或改这里的挂载点），必须同步修改另一处。
      - bot-data:/app/data
    # Docker 默认的 json-file 日志没有上限：一个长期运行的容器会把宿主磁盘写满。
    # 这里限制为 3 × 10 MiB（约 30 MiB/容器）。裸机运行时程序只写 stderr，
    # 轮转交给 systemd / 进程管理器 / shell 重定向，应用不与宿主争夺这件事（D-23）。
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 运维端口只对容器网络暴露，不发布到宿主（D-10）。
    expose:
      - "8080"
    healthcheck:
      # 用 /livez 而非 /readyz：站点临时故障不应触发容器重启风暴。
      # 不变量：下面的 URL 硬编码 8080，与 Dockerfile 的 HEALTHCHECK 及默认
      # ops.port=8080 一致；修改 ops.port 时必须同步改这两处健康检查。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3).getcode() == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  bot-data:
