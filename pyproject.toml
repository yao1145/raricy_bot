[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raricy-bot"
version = "0.1.0"
description = "Raricy 站内聊天机器人"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["raricy_bot*"]

[tool.pytest.ini_options]
# pythonpath 让测试无需先安装包即可导入 raricy_bot
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
